<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Réception">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Réception HACCP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout : une colonne façon appli, gros boutons tactiles, barre d'onglets en bas. Couleurs : neutres légèrement rosés, rappel des 4 barres du logo du lycée. */
:root{
  --bg:#f3f1f2; --surface:#ffffff; --surface-2:#e9e4e7; --ink:#231f20; --ink-2:#5d5559; --line:#d9d1d5;
  --accent:#8c1a76; --accent-ink:#ffffff; --accent-soft:#f3e1ee; --accent-2:#8c1a76; --accent-2-ink:#ffffff;
  --ok:#1b7339; --ok-bg:#d9eedf; --warn:#8f5400; --warn-bg:#f9e8c9; --bad:#b3261a; --bad-bg:#f9dcd7;
  --b-rouge:#ed1c24; --b-bordeaux:#a51724; --b-magenta:#ec008c; --b-violet:#9d1882;
  --cat-fl:#3d7d35; --cat-fl-bg:#e1efdc; --cat-frais:#b0306a; --cat-frais-bg:#f7e0ea; --cat-surg:#1f6fa8; --cat-surg-bg:#dcebf6; --cat-epi:#94661a; --cat-epi-bg:#f4e8d2;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-disp:"Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --r:14px; --nav-h:64px; --strip:flex;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151214; --surface:#1f1a1d; --surface-2:#2a2327; --ink:#f1ecef; --ink-2:#b4a8af; --line:#3a3136;
  --accent:#e27fcb; --accent-ink:#2a0a22; --accent-soft:#3b1f34; --accent-2:#e27fcb; --accent-2-ink:#2a0a22;
  --ok:#72d394; --ok-bg:#15331f; --warn:#f1b65c; --warn-bg:#3a2a0f; --bad:#ff8e80; --bad-bg:#421b16;
  --cat-fl:#8fd17f; --cat-fl-bg:#1d3319; --cat-frais:#f08bb8; --cat-frais-bg:#3d1a2a; --cat-surg:#7fbde8; --cat-surg-bg:#15293a; --cat-epi:#e2b664; --cat-epi-bg:#3a2c14; color-scheme:dark}
  :root:not([data-theme="light"]) .logo-l{display:none} :root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"]{
  --bg:#151214; --surface:#1f1a1d; --surface-2:#2a2327; --ink:#f1ecef; --ink-2:#b4a8af; --line:#3a3136;
  --accent:#e27fcb; --accent-ink:#2a0a22; --accent-soft:#3b1f34; --accent-2:#e27fcb; --accent-2-ink:#2a0a22;
  --ok:#72d394; --ok-bg:#15331f; --warn:#f1b65c; --warn-bg:#3a2a0f; --bad:#ff8e80; --bad-bg:#421b16;
  --cat-fl:#8fd17f; --cat-fl-bg:#1d3319; --cat-frais:#f08bb8; --cat-frais-bg:#3d1a2a; --cat-surg:#7fbde8; --cat-surg-bg:#15293a; --cat-epi:#e2b664; --cat-epi-bg:#3a2c14; color-scheme:dark}
:root[data-theme="dark"] .logo-l{display:none} :root[data-theme="dark"] .logo-d{display:block}

.logo{height:48px;width:auto;max-width:100%;display:block}
.logo-d{display:none}
.brand-strip{display:var(--strip);height:5px}
.brand-strip span{flex:1}
.brand-strip span:nth-child(1){background:var(--b-rouge)} .brand-strip span:nth-child(2){background:var(--b-magenta)}
.brand-strip span:nth-child(3){background:var(--b-violet)} .brand-strip span:nth-child(4){background:var(--b-bordeaux)}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.view{min-height:100%}
.eyebrow{font-family:var(--f-disp);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--ink-2)}
.demo-band{background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:.9rem;text-align:center;padding:6px 16px}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:10px 20px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);font-weight:700}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-big{width:100%;min-height:84px;font-family:var(--f-disp);font-size:1.6rem;letter-spacing:.02em}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent);min-height:44px;padding:8px 10px}
.btn-danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.55;cursor:default}
.plus{font-size:2rem;line-height:1;margin-top:-4px}

/* puces de choix */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:52px;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-2-ink)}
.chip.small{min-height:40px;padding:6px 14px;font-size:.95rem}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tile{min-height:92px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px 14px;text-align:left;font-weight:700;line-height:1.2}
.tile small{font-weight:400;color:var(--ink-2);font-size:.85rem}
.tile[aria-pressed="true"]{border-color:var(--accent-2);background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent-2)}
.tile .ico{width:28px;height:28px;color:var(--accent)}
.picto{display:inline-grid;place-items:center;flex:none}
.picto svg{width:28px;height:28px}
.picto.trait{color:var(--accent)}
.picto.pastille{width:44px;height:44px;border-radius:50%}
.picto.pastille svg{width:26px;height:26px}
.cat-fl{--c:var(--cat-fl);--cb:var(--cat-fl-bg)} .cat-frais{--c:var(--cat-frais);--cb:var(--cat-frais-bg)}
.cat-surg{--c:var(--cat-surg);--cb:var(--cat-surg-bg)} .cat-epi{--c:var(--cat-epi);--cb:var(--cat-epi-bg)}
.picto.pastille{background:var(--cb);color:var(--c)}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.tile-top .picto.pastille{width:38px;height:38px}
.tile-top .picto.pastille svg{width:22px;height:22px}
.seuil-chip{font-family:var(--f-disp);font-weight:700;font-size:1.05rem;line-height:1;padding:5px 9px;border-radius:8px;background:var(--cb);color:var(--c);white-space:nowrap}
.seuil-chip.libre{font-size:.85rem;font-family:var(--f-body);background:var(--surface-2);color:var(--ink-2)}
.theme-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-pick button{min-height:64px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:.95rem}
.theme-pick button svg{width:22px;height:22px}
.theme-pick button[aria-pressed="true"]{border-color:var(--accent-2);background:var(--accent-soft);color:var(--accent)}
.version{border:0;background:none;color:var(--ink-2);font-size:.85rem;text-align:center;padding:10px;width:100%;user-select:none;-webkit-user-select:none}
.log{display:flex;flex-direction:column;gap:14px}
.log h4{margin:0;font-family:var(--f-disp);font-size:1.15rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.log h4 span{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--ink-2)}
.log ul{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:.95rem}

/* étapes de saisie */
.step{display:grid;grid-template-columns:36px 1fr;gap:6px 12px}
.step>.n{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:1.2rem;color:var(--ink-2)}
.step.done>.n{background:var(--ok);color:var(--surface)}
.step>.body{min-width:0;display:flex;flex-direction:column;gap:12px}
.step h2{font-size:1.3rem;padding-top:5px}
.input{width:100%;min-height:52px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);padding:10px 14px}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{min-height:80px;resize:vertical}

.photo-btn{width:100%;min-height:140px;border:2px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:1.1rem;text-align:center;padding:12px}
.photo-btn svg{width:44px;height:44px}
.photo-prev{position:relative;border-radius:var(--r);overflow:hidden;border:2px solid var(--line);background:var(--surface-2)}
.photo-prev img{display:block;width:100%;max-height:340px;object-fit:contain}
.photo-prev .btn{position:absolute;right:10px;bottom:10px;min-height:44px}

.temp-row{display:flex;gap:10px;align-items:stretch}
.sign{width:64px;flex:none;font-size:1.8rem;font-family:var(--f-disp)}
.temp-in{flex:1;min-width:0;font-size:2rem;font-family:var(--f-disp);font-weight:700;text-align:center;min-height:68px}
.unit{display:grid;place-items:center;font-family:var(--f-disp);font-size:1.6rem;color:var(--ink-2);padding:0 4px}

.verdict{border-radius:var(--r);padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.warn{background:var(--warn-bg);color:var(--warn)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict.info{background:var(--surface-2);color:var(--ink-2);font-weight:400}

.conf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conf button{min-height:74px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem}
.conf .c-ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.conf .c-bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.actionbar .inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.missing{font-size:.9rem;color:var(--bad);text-align:center}

/* navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-inner{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:640px}
.nav button{min-height:var(--nav-h);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--ink-2);position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent-2)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:var(--surface);font-size:.75rem;display:grid;place-items:center;padding:0 5px}

/* listes */
.alert-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--bad-bg);color:var(--bad);border:0;width:100%;text-align:left}
.alert-card strong{font-size:1.15rem;display:block}
.alert-card .big{font-family:var(--f-disp);font-size:2.4rem;font-weight:700;line-height:1;min-width:40px;text-align:center}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .time{font-family:var(--f-disp);font-weight:700;font-size:1.15rem;min-width:48px}
.row .main{min-width:0}
.row .main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main span{font-size:.88rem;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:.85rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.empty{padding:22px 16px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.day-h{font-family:var(--f-disp);font-weight:700;font-size:1.05rem;color:var(--ink-2);margin:4px 2px -10px}
.home-logo{padding-block:4px 14px}
.last{font-size:.95rem;color:var(--ink-2)}

/* bilan */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--f-disp);font-weight:700;font-size:2.2rem;line-height:1}
.kpi .l{font-size:.9rem;color:var(--ink-2)}
.kpi.bad .v{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.bar{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr 2.5rem;gap:10px;align-items:center;font-size:.95rem}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar .track,.bar .fill{display:block}
.bar .fill{height:100%;background:var(--accent);border-radius:7px}
.bar .fill.bad{background:var(--bad)}
.bar .val{text-align:right;font-weight:700}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}


/* fiche détail */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(8,14,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.edit-list{display:flex;flex-direction:column;gap:6px}
.edit-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;border-radius:10px;background:var(--surface-2)}
.inline{display:flex;gap:8px}
.inline .input{flex:1;min-width:0}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.toast.err{background:var(--bad);color:var(--surface)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.setup-hero{display:flex;flex-direction:column;gap:8px;padding-top:24px}
.thermo{width:56px;height:56px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px}
.small{font-size:.9rem}
a{color:var(--accent)}
/* v2.2 */
.btn svg{width:22px;height:22px;flex:none}
.status-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.status-card .sc-ico{width:30px;height:30px;color:var(--accent)}
.status-card .sc-txt{min-width:0;display:flex;flex-direction:column}
.status-card .sc-txt b{font-size:1.05rem}
.status-card .sc-txt span{font-size:.9rem;color:var(--ink-2)}
.status-card .chev{font-size:1.8rem;color:var(--ink-2);line-height:1}
.status-card.warn{background:var(--warn-bg);border-color:transparent}
.status-card.warn .sc-ico,.status-card.warn .sc-txt span{color:var(--warn)}
.status-card.bad{background:var(--bad-bg);border-color:transparent}
.status-card.bad .sc-ico,.status-card.bad .sc-txt span{color:var(--bad)}
.status-card.ok .sc-ico{color:var(--ok)}
.status-card .btn{min-height:44px;padding:6px 14px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(20,16,18,.65);color:#fff;font-size:1.3rem;line-height:1}
.ph-add{aspect-ratio:1;max-width:100%;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:.85rem;text-align:center;padding:6px;cursor:pointer}
.ph-add svg{width:32px;height:32px}
.bon-btn{justify-content:flex-start;gap:8px;cursor:pointer;flex-wrap:wrap}
.bon-btn svg{width:22px;height:22px;color:var(--accent)}
.bon-ok{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.bon-ok img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.fr-row{display:flex;flex-direction:column;gap:10px;padding:14px;border-top:1px solid var(--line)}
.fr-row:first-child{border-top:0}
.fr-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fr-nom{display:flex;align-items:center;gap:8px;min-width:0}
.fr-ico{width:24px;height:24px;color:var(--accent);flex:none}
.temp-row.mini .sign{width:56px;min-height:56px;font-size:1.5rem}
.temp-row.mini .temp-in{min-height:56px;font-size:1.6rem}
.fr-actions{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--bad-bg)}
.search{position:relative}
.search .s-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-2);pointer-events:none}
.search .input{padding-left:44px}
.snippet{display:flex;gap:4px;align-items:center;font-size:.82rem;color:var(--accent);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.snippet svg{width:14px;height:14px;flex:none}
.gallery{display:flex;flex-direction:column;gap:12px}
.gallery figure{margin:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.gallery img{display:block;width:100%;max-height:420px;object-fit:contain}
.gallery figcaption{font-size:.85rem;color:var(--ink-2);padding:6px 10px;background:var(--surface)}
.kv dd.ocr{font-weight:400;font-size:.9rem;color:var(--ink-2)}
.sub{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.sub h4{margin:0;font-family:var(--f-disp);font-size:1.15rem}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;cursor:pointer}
.opt input{width:26px;height:26px;accent-color:var(--accent);flex:none}
.enc-list{display:flex;flex-direction:column;gap:10px}
.enc-item{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--surface-2)}
.enc-nums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.enc-nums label{display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}
.box-ico{width:22px;height:22px;color:var(--accent);vertical-align:-3px}
.resp{border-color:var(--accent)}
</style>

function typeDe(nom, types){ return (types || (D && D.types) || []).find(t => t.nom === nom) || {nom, obligatoire:false, ideal:null, limite:null}; }
function categorie(nom){
  const n = (nom||'').toLowerCase();
  if (n.includes('surgel')) return 'surg';
  if (n.includes('fruit') || n.includes('légum')) return 'fl';
  if (n.includes('frais') || n.includes('viande') || n.includes('poisson') || n.includes('lait')) return 'frais';
  return 'epi';
}
function picto(nom){ const c = categorie(nom); return `<span class="picto pastille cat-${c}" aria-hidden="true">${icon(c)}</span>`; }
// Contrôle d'une température par rapport à un seuil : "Conforme", "Tolérance", "Hors norme"
function controleSeuil(ty, t){
  if (t === null || t === undefined || t === '' || isNaN(t)) return ty.obligatoire ? 'Manquante' : 'Non mesurée';
  if (ty.limite !== null && ty.limite !== undefined && t > ty.limite) return 'Hors norme';
  if (ty.ideal !== null && ty.ideal !== undefined && t > ty.ideal) return 'Tolérance';
  return 'Conforme';
}
function controle(typeNom, t, types){ return controleSeuil(typeDe(typeNom, types), t); }
const classeControle = c => ({'Conforme':'ok','Tolérance':'warn','Hors norme':'bad','Manquante':'bad'}[c] || 'neutral');
const aTraiter = r => r.conformite === 'Non conforme' && !r.traitement;
function seuilTexte(ty){
  if (ty.limite === null && ty.ideal === null) return '';
  if (ty.ideal !== null && ty.limite !== null && ty.ideal !== ty.limite) return `Idéal ${fmtT(ty.ideal)} ou moins, limite ${fmtT(ty.limite)}.`;
  return `Maximum ${fmtT(ty.limite !== null ? ty.limite : ty.ideal)}.`;
}
function lireTemp(signe, txt){
  const s = String(txt ?? '').replace(',', '.').trim();
  if (s === '' || isNaN(Number(s))) return null;
  return Math.round(signe * Math.abs(Number(s)) * 10) / 10;
}

/* ============================================================ accès au Google Sheet */
async function api(action, payload={}){
  if (cfg && cfg.demo) return demoApi(action, payload);
  let res;
  try{
    if (action === 'init' || action === 'photo'){
      const u = new URL(cfg.api);
      u.searchParams.set('action', action); u.searchParams.set('cle', cfg.cle);
      if (payload.id) u.searchParams.set('id', payload.id);
      res = await fetch(u.toString());
    } else {
      res = await fetch(cfg.api, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action, cle:cfg.cle}, payload))});
    }
  }catch(e){ const x = new Error("Pas de connexion internet."); x.reseau = true; throw x; }
  let j;
  try{ j = await res.json(); }catch(e){ const x = new Error("Le Google Sheet ne répond pas. Réessayez dans un instant."); x.reseau = true; throw x; }
  if (!j.ok) throw new Error(j.erreur || 'Erreur inconnue');
  return j;
}

/* ============================================================ file d'attente (mode hors ligne) */
const Attente = (() => {
  let dbp = null; const mem = new Map();
  const db = () => dbp || (dbp = new Promise((ok, ko) => {
    try{ const r = indexedDB.open('haccp-attente', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('attente', {keyPath:'id'});
      r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }catch(e){ ko(e); }
  }));
  async function tx(mode, fn){
    const d = await db();
    return new Promise((ok, ko) => { const t = d.transaction('attente', mode); const req = fn(t.objectStore('attente'));
      t.oncomplete = () => ok(req && req.result); t.onerror = () => ko(t.error); });
  }
  return {
    async put(it){ try{ await tx('readwrite', s => s.put(it)); }catch(e){ mem.set(it.id, it); } },
    async del(id){ mem.delete(id); try{ await tx('readwrite', s => s.delete(id)); }catch(e){} },
    async all(){ let a = []; try{ a = (await tx('readonly', s => s.getAll())) || []; }catch(e){}
      mem.forEach(m => { if (!a.some(x => x.id === m.id)) a.push(m); });
      return a.sort((x, y) => x.cree - y.cree); }
  };
})();

function versAffichage(it){
  if (it.kind === 'releve') return Object.assign({}, it.data, {_attente:true});
  const d = it.data;
  return Object.assign({}, d, {photos:undefined, photoBon:undefined, photoIds:[], _attente:true, _photos:d.photos || [], _bon:d.photoBon || '', traitement:'', erreur:it.erreur});
}
function fusionner(){
  if (!D) return;
  const ids = new Set(attente.map(a => a.id));
  D.receptions = attente.filter(a => a.kind === 'reception').map(versAffichage).reverse()
    .concat((D.receptions || []).filter(r => !ids.has(r.id) && !r._attente));
  D.releves = attente.filter(a => a.kind === 'releve').map(versAffichage).reverse()
    .concat((D.releves || []).filter(r => !ids.has(r.id) && !r._attente));
}
function sauverCache(){
  if (!D || cfg.demo) return;
  const c = Object.assign({}, D, {receptions: D.receptions.filter(r => !r._attente), releves: (D.releves||[]).filter(r => !r._attente)});
  LS.set('haccp.cache', c);
}
async function mettreEnAttente(kind, data){
  const it = {id:data.id, kind, data, cree:Date.now()};
  await Attente.put(it);
  attente.push(it); fusionner();
}
let envoiEnCours = false;
async function envoyerAttente(){
  if (envoiEnCours || !attente.length) return;
  envoiEnCours = true; let change = false;
  try{
    for (const it of attente.slice()){
      try{
        const j = await api(it.kind === 'releve' ? 'releve' : 'ajouter', it.kind === 'releve' ? {releve:it.data} : {reception:it.data});
        await Attente.del(it.id);
        attente = attente.filter(a => a.id !== it.id);
        const srv = j.reception || j.releve;
        if (srv && D){
          if (it.kind === 'releve') D.releves = (D.releves||[]).map(r => r.id === it.id ? srv : r);
          else { srv.controleTemp = srv.controleTemp || controle(srv.type, srv.temperature); D.receptions = D.receptions.map(r => r.id === it.id ? srv : r); }
        }
        if (it.kind === 'reception' && D && !D.fournisseurs.includes(it.data.fournisseur)) D.fournisseurs.push(it.data.fournisseur);
        change = true;
      }catch(x){
        if (x.reseau) break; // toujours pas de réseau : on réessaiera
        it.erreur = x.message; await Attente.put(it); change = true;
      }
    }
  } finally { envoiEnCours = false; }
  if (change){ fusionner(); sauverCache(); if (vueTranquille()) render(); }
}
const vueTranquille = () => vue !== 'saisie' && vue !== 'frigos' && !fiche && !$('#app :focus');

  const c = document.createElement('canvas'); c.width = 640; c.height = 420;

  g.fillStyle = '#f6f3ea'; g.fillRect(0,0,640,420);
  g.strokeStyle = '#333'; g.lineWidth = 4; g.strokeRect(20,20,600,380);

async function demoApi(action, p){
  await new Promise(r => setTimeout(r, 250));
  if (window.__horsLigne && action !== 'photo'){ const x = new Error('Pas de connexion internet.'); x.reseau = true; throw x; }
  const d = demoInit();
  const codeOk = () => { if (p.code !== '1234') throw new Error('Code responsable incorrect (en démo : 1234)'); };
  switch (action){
    case 'init': { demoSave(d); const out = JSON.parse(JSON.stringify(d)); delete out.photos; delete out.config; out.enceintes = out.enceintes.filter(e => e.actif); out.ok = true; return out; }
    case 'photo': {
      if (d.photos && d.photos[p.id]) return {mime:'image/jpeg', data:d.photos[p.id].split(',')[1]};
      const r = d.receptions.find(x => photosDe(x).includes(p.id) || x.photoBon === p.id) || {};
      const lot = (String(r.ocr || '').match(/LOT : (\S+)/) || [])[1] || 'L2600-B';
      return {mime:'image/jpeg', data: demoEtiquette(p.id.endsWith('bon') ? ['BON DE LIVRAISON', r.fournisseur || '', 'BL-2026-118', '—'] : [r.fournisseur||'Fournisseur', r.type||'', lot, '18/11/2026']).split(',')[1]};
    }
    case 'ajouter': {
      const r = Object.assign({}, p.reception);
      if (d.receptions.some(x => x.id === r.id)) return {ok:true, doublon:true};
      d.photos = d.photos || {};
      r.photoIds = (r.photos || []).map((ph, i) => { const id = `ph-${r.id}-${i}`; d.photos[id] = ph; return id; });
      if (r.photoBon){ d.photos[`ph-${r.id}-bon`] = r.photoBon; r.photoBon = `ph-${r.id}-bon`; }
      delete r.photos; r.ocr = '';
      Object.assign(r, {traitement:'', commentaireTraitement:'', traitePar:'', dateTraitement:''});
      d.receptions.unshift(r);
      if (!d.fournisseurs.includes(r.fournisseur)) d.fournisseurs.push(r.fournisseur);
      demoSave(d); return {ok:true, reception:r};
    }
    case 'releve': {
      if (d.releves.some(x => x.id === p.releve.id)) return {ok:true, doublon:true};
      d.releves.unshift(p.releve); demoSave(d); return {ok:true, releve:p.releve};
    }
    case 'traiter': {
      const r = d.receptions.find(x => x.id === p.id);
      Object.assign(r, {traitement:p.traitement, commentaireTraitement:p.commentaire||'', traitePar:p.par, dateTraitement:new Date().toISOString()});
      demoSave(d); return {ok:true, reception:r};
    }
    case 'responsable': codeOk(); return {ok:true};
    case 'config': codeOk(); return {ok:true, config:Object.assign({}, d.config, {enceintes:d.enceintes})};
    case 'setConfig': codeOk(); Object.assign(d.config, p.config); demoSave(d); return {ok:true, config:Object.assign({}, d.config, {enceintes:d.enceintes})};
    case 'enceintes': codeOk(); d.enceintes = p.liste; demoSave(d); return {ok:true, enceintes:d.enceintes};
    case 'listes': codeOk(); d[p.liste] = p.valeurs; demoSave(d); return {ok:true, valeurs:p.valeurs};
    case 'testMail': codeOk(); throw new Error("En mode démo, aucun e-mail n'est envoyé.");
    case 'registre': throw new Error("En mode démo, le PDF n'est pas créé. Il le sera avec le vrai registre.");
  }
  throw new Error('Action inconnue');
}

      <h2>Photos des étiquettes</h2>

    <section class="step ${done[5]?'done':''}"><span class="n">5</span><div class="body">
      <h2>Température à cœur</h2>

        <input id="in-temp" class="input temp-in num" inputmode="decimal" placeholder="0,0" value="${esc(s.temp)}" aria-label="Température en degrés" autocomplete="off">
        <span class="unit">°C</span></div><div id="verdict">${htmlVerdict()}</div>` : `<div class="verdict info">Choisissez d'abord le type de produit.</div>`}
    </div></section>
    <section id="step6" class="step ${done[6]?'done':''}">${htmlStep6()}</section>
  </div>
  <div class="actionbar"><div class="inner">
    <p class="missing" id="manque" ${s.essai && m.length ? '' : 'hidden'}>Il manque : ${m.join(', ')}</p>

}
function htmlVerdict(){
  const s = saisie; if (!s.type) return '';
  const t = tempValeur(), ty = typeDe(s.type), c = controle(s.type, t);
  if (t === null) return ty.obligatoire ? `<div class="verdict info">Température obligatoire pour ce produit. ${seuilTexte(ty)}</div>` : `<div class="verdict info">Facultatif pour ce produit. Vous pouvez passer.</div>`;
  if (c === 'Conforme') return `<div class="verdict ok">✓ Température conforme</div>`;
  if (c === 'Tolérance') return `<div class="verdict warn">Température dans la tolérance. ${seuilTexte(ty)}</div>`;
  return `<div class="verdict bad">Température hors norme. ${seuilTexte(ty)} La livraison passe en non conforme.</div>`;
}
function htmlStep6(){
  const s = saisie;
  return `<span class="n">6</span><div class="body">
      <h2>La livraison est…</h2>
      <div class="conf">
        <button class="c-ok" data-conf="Conforme" aria-pressed="${s.conformite==='Conforme'}">Conforme</button>
        <button class="c-bad" data-conf="Non conforme" aria-pressed="${s.conformite==='Non conforme'}">Non conforme</button>
      </div>
      ${s.conformite === 'Non conforme' ? `<p style="margin:0"><b>Pourquoi ?</b> <span class="muted small">(plusieurs choix possibles)</span></p>
        <div class="chips">${MOTIFS.map(x => `<button class="chip small" data-motif="${esc(x)}" aria-pressed="${s.motifs.includes(x)}">${esc(x)}</button>`).join('')}</div>
        <textarea id="in-rem" class="input" placeholder="Remarque (facultatif) : ce qui a été dit au livreur…">${esc(s.remarque)}</textarea>` : ''}
    </div>`;
}
function majEtapes(){
  // Mise à jour légère pendant la frappe (sans redessiner tout l'écran, pour garder le clavier ouvert)
  const s = saisie, t = tempValeur(), ty = s.type ? typeDe(s.type) : null;
  const v = $('#verdict'); if (v) v.innerHTML = htmlVerdict();
  const st5 = $('#in-temp') && $('#in-temp').closest('.step'); if (st5) st5.classList.toggle('done', !!(s.type && (t !== null || !ty.obligatoire)));
  const s6 = $('#step6'); s6.innerHTML = htmlStep6(); s6.classList.toggle('done', !!s.conformite && (s.conformite==='Conforme' || s.motifs.length)); lierStep6();
  const ms = $('#manque'); if (ms){ const m = manquants(); ms.hidden = !(s.essai && m.length); ms.textContent = 'Il manque : ' + m.join(', '); }
}
function majPhotos(){
  $('#zone-photos').innerHTML = htmlPhotos(); $('#step4').classList.toggle('done', saisie.photos.length > 0); lierPhotos();
  const ms = $('#manque'); if (ms){ const m = manquants(); ms.hidden = !(saisie.essai && m.length); ms.textContent = 'Il manque : ' + m.join(', '); }
}
function lierPhotos(){
  const s = saisie;
  $('#in-photo').onchange = async e => {
    const fs = [...(e.target.files || [])]; if (!fs.length) return;
    try{ for (const f of fs) s.photos.push(await compresser(f)); majPhotos(); }
    catch(x){ toast("Impossible de lire la photo. Réessayez.", true); }
  };
  $('#in-bon').onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try{ s.bon = await compresser(f); majPhotos(); }catch(x){ toast("Impossible de lire la photo. Réessayez.", true); }
  };
  $$('[data-suppr-photo]').forEach(b => b.onclick = () => { s.photos.splice(+b.dataset.supprPhoto, 1); majPhotos(); });
  const sb = $('#suppr-bon'); if (sb) sb.onclick = () => { s.bon = ''; majPhotos(); };
}
function lierStep6(){
  const s = saisie;
  $$('[data-conf]').forEach(b => b.onclick = () => {
    s.conformite = b.dataset.conf;
    if (s.conformite === 'Non conforme' && controle(s.type, tempValeur()) === 'Hors norme' && !s.motifs.includes('Température')) s.motifs.push('Température');
    if (s.conformite === 'Conforme') s.motifs = [];
    majEtapes();
  });
  $$('[data-motif]').forEach(b => b.onclick = () => {
    const x = b.dataset.motif; s.motifs = s.motifs.includes(x) ? s.motifs.filter(y => y !== x) : s.motifs.concat(x); majEtapes();
  });
  const rem = $('#in-rem'); if (rem) rem.oninput = () => s.remarque = rem.value;
}
function redessinerSaisie(focusId){
  const y = window.scrollY; render(); window.scrollTo(0, y);
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus(); }
}
function lierSaisie(){
  const s = saisie;
  $('#annuler').onclick = () => { vue = 'accueil'; saisie = null; render(); };
  $$('[data-agent]').forEach(b => b.onclick = () => { s.agent = b.dataset.agent; prefs.agent = s.agent; LS.set('haccp.prefs', prefs); redessinerSaisie(); });
  $$('[data-four]').forEach(b => b.onclick = () => { s.fournisseur = b.dataset.four; s.autreF = false; redessinerSaisie(); });
  $('#autre-f').onclick = () => { s.autreF = true; s.fournisseur = ''; redessinerSaisie('in-four'); };
  const inF = $('#in-four'); if (inF) inF.oninput = () => { s.fournisseur = inF.value.trim(); inF.closest('.step').classList.toggle('done', !!s.fournisseur); };
  $$('[data-type]').forEach(b => b.onclick = () => {
    s.type = b.dataset.type; const ty = typeDe(s.type);
    s.signe = (ty.ideal !== null && ty.ideal < 0) ? -1 : 1;
    redessinerSaisie();
  });
  lierPhotos();
  const sg = $('#sign'); if (sg) sg.onclick = () => { s.signe *= -1; majTemp(); sg.textContent = s.signe < 0 ? '−' : '+'; majEtapes(); };
  const it = $('#in-temp');
  if (it) it.oninput = () => {
    if (it.value.includes('-')){ s.signe = -1; it.value = it.value.replace(/-/g,''); }
    s.temp = it.value.replace(/[^0-9.,]/g,''); if (it.value !== s.temp) it.value = s.temp;
    majTemp(); if (sg) sg.textContent = s.signe < 0 ? '−' : '+'; majEtapes();
  };
  lierStep6();
  $('#enreg').onclick = enregistrer;
}
function majTemp(){
  const s = saisie;
  if (s.type && controle(s.type, tempValeur()) === 'Hors norme'){
    s.conformite = 'Non conforme'; if (!s.motifs.includes('Température')) s.motifs.push('Température');
  }
}
async function compresser(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.78);
  } finally { URL.revokeObjectURL(url); }
}
async function enregistrer(){
  const s = saisie; s.essai = true;
  if (manquants().length){ majEtapes(); majPhotos(); return; }
  s.envoi = true; redessinerSaisie();
  const t = tempValeur();
  const rec = {id:uid(), date:new Date().toISOString(), agent:s.agent, fournisseur:s.fournisseur, type:s.type, temperature:t,
    controleTemp: controle(s.type, t), conformite:s.conformite, motif:s.motifs.join(', '), remarque:s.remarque.trim(), photos:s.photos, photoBon:s.bon};
  try{ await mettreEnAttente('reception', rec); }
  catch(x){ s.envoi = false; redessinerSaisie(); toast("Impossible d'enregistrer sur l'appareil. Réessayez.", true); return; }
  if (!D.fournisseurs.includes(rec.fournisseur)) D.fournisseurs.push(rec.fournisseur);
  saisie = null; vue = 'accueil'; render(); window.scrollTo(0,0);
  await envoyerAttente();
  const reste = attente.some(a => a.id === rec.id);
  if (reste) toast('Enregistrée sur l\'appareil. Envoi dès que le réseau revient.');
  else toast(rec.conformite === 'Non conforme' ? 'Enregistrée. Non-conformité à traiter.' : 'Livraison enregistrée ✓');
  if (vueTranquille()) render();
}

  D.enceintes.forEach(e => frigo.vals[e.nom] = {signe: (e.ideal !== null && e.ideal < 0) || (e.limite !== null && e.limite < 0) ? -1 : 1, temp:'', actions:[], texte:''});

}
const ACTIONS = ['Porte refermée','Thermostat réglé','Produits déplacés','Technicien prévenu','Nouveau contrôle prévu'];
function htmlFrigoVerdict(e){

function htmlFrigoActions(e){

        <div class="temp-row mini"><button class="btn sign" data-fsign="${esc(e.nom)}" aria-label="Changer le signe">${v.signe<0?'−':'+'}</button>
          <input class="input temp-in num" data-ftemp="${esc(e.nom)}" inputmode="decimal" placeholder="0,0" value="${esc(v.temp)}" aria-label="Température ${esc(e.nom)}" autocomplete="off"><span class="unit">°C</span></div>

function lierFrigos(){
  const f = frigo;
  $('#f-retour').onclick = () => { vue = 'accueil'; frigo = null; render(); };
  $$('[data-fagent]').forEach(b => b.onclick = () => { f.agent = b.dataset.fagent; prefs.agent = f.agent; LS.set('haccp.prefs', prefs); $$('[data-fagent]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  const maj = nom => {
    const e = D.enceintes.find(x => x.nom === nom), row = [...$$('.fr-row')].find(r => r.dataset.enc === nom);
    row.querySelector('.fr-verdict').innerHTML = htmlFrigoVerdict(e);

    row.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { const v = f.vals[b.dataset.fa], a = b.dataset.act;
      v.actions = v.actions.includes(a) ? v.actions.filter(x => x !== a) : v.actions.concat(a); b.setAttribute('aria-pressed', v.actions.includes(a)); });
    row.querySelectorAll('[data-ftxt]').forEach(i => i.oninput = () => f.vals[i.dataset.ftxt].texte = i.value);
  };
  $$('.fr-row').forEach(lierActions);
  $$('[data-fsign]').forEach(b => b.onclick = () => { const v = f.vals[b.dataset.fsign]; v.signe *= -1; b.textContent = v.signe < 0 ? '−' : '+'; maj(b.dataset.fsign); });
  $$('[data-ftemp]').forEach(i => i.oninput = () => {
    const v = f.vals[i.dataset.ftemp];

/* ============================================================ historique + recherche de lot */
function vueHistorique(resultatsSeuls){
  const q = filtres.q.trim().toLowerCase(), qn = norm(q);
  const res = D.receptions.filter(r => {
    r._extrait = '';
    if (filtres.type && r.type !== filtres.type) return false;
    if (filtres.nc && !aTraiter(r)) return false;
    if (!q) return true;
    if ([r.fournisseur, r.agent, r.motif, r.type, r.remarque].join(' ').toLowerCase().includes(q)) return true;
    if (qn.length >= 3 && r.ocr && norm(r.ocr).includes(qn)){
      const l = String(r.ocr).split('\n').find(x => norm(x).includes(qn)) || '';
      r._extrait = 'Étiquette : ' + l.trim().slice(0, 60); return true;
    }
    return false;
  });
  const nbNC = D.receptions.filter(aTraiter).length;
  let html = '', jc = '';
  res.slice(0, 250).forEach(r => {
    const j = jour(r.date);
    if (j !== jc){ if (jc) html += '</div>'; html += `<p class="day-h">${j}</p><div class="list">`; jc = j; }
    html += ligne(r);
  });
  if (jc) html += '</div>';
  const vide = `<div class="empty">${filtres.nc ? 'Aucune non-conformité à traiter. Tout est à jour.' : q ? `Rien trouvé pour « ${esc(filtres.q)} ».<br><span class="small">Le texte des étiquettes est lu automatiquement environ 10 minutes après l'envoi.</span>` : 'Aucune livraison ne correspond.'}</div>`;
  const out = res.length ? html + (res.length > 250 ? `<p class="muted small">Seules les 250 plus récentes sont affichées. Tout est dans le Google Sheet.</p>` : '') : vide;
  if (resultatsSeuls) return out;
  return `<h1>Historique</h1>
  <div class="search">${icon('search','s-ico')}<input id="h-q" class="input" type="search" placeholder="Fournisseur, nom ou n° de lot…" value="${esc(filtres.q)}" aria-label="Rechercher"></div>
  <p class="muted small" style="margin:-10px 0 0">Un numéro de lot est cherché dans le texte des photos d'étiquettes, utile en cas de rappel produit.</p>
  <div class="chips">
    <button class="chip small" data-ftype="" aria-pressed="${!filtres.type && !filtres.nc}">Tout</button>
    <button class="chip small" id="f-nc" aria-pressed="${filtres.nc}">À traiter${nbNC ? ` (${nbNC})` : ''}</button>
    ${D.types.map(t => `<button class="chip small" data-ftype="${esc(t.nom)}" aria-pressed="${filtres.type===t.nom}">${esc(t.nom)}</button>`).join('')}
  </div>
  <div id="h-res" class="stack" style="gap:20px">${out}</div>`;
}
function lierHistorique(){
  const q = $('#h-q');
  q.oninput = () => { filtres.q = q.value; $('#h-res').innerHTML = vueHistorique(true); lierLignes(); };
  $$('[data-ftype]').forEach(b => b.onclick = () => { filtres.type = b.dataset.ftype; filtres.nc = false; render(); });

}

async function chargerPhotos(r){
  const maj = () => { const el = $('#fiche-photo'); if (el && fiche && fiche.r === r) el.innerHTML = htmlGalerie(); };
  if (r._attente){
    fiche.photos = r._photos.map((p, i) => ({src:p, label:`Étiquette ${i+1}`})).concat(r._bon ? [{src:r._bon, label:'Bon de livraison'}] : []);
    return maj();
  }
  const liste = photosDe(r).map((id, i, a) => ({id, label: a.length > 1 ? `Étiquette ${i+1}` : 'Étiquette'})).concat(r.photoBon ? [{id:r.photoBon, label:'Bon de livraison'}] : []);
  if (!liste.length){ fiche.photos = []; return maj(); }
  fiche.photos = null; maj();
  const out = [];
  for (const p of liste){
    try{ const j = await api('photo', {id:p.id}); out.push({src:`data:${j.mime};base64,${j.data}`, label:p.label}); }
    catch(x){ out.push({label:p.label, err: x.reseau ? 'pas de connexion' : x.message}); }
    if (!fiche || fiche.r !== r) return;
    fiche.photos = out.slice(); maj();
  }
}

let pdf = null; // {mois, etat, url, err}
function vueBilan(){
  if (!moisBilan) moisBilan = cleMois(new Date());

  const maintenant = cleMois(new Date());

    <div class="kpi ${nc.length ? 'bad':''}"><div class="v num">${nc.length}</div><div class="l">non conformes${nc.filter(aTraiter).length ? ` · ${nc.filter(aTraiter).length} à traiter` : ''}</div></div>
    <div class="kpi ${hors ? 'bad':''}"><div class="v num">${hors}</div><div class="l">températures hors norme</div></div>
  </div>
  <p class="muted small" style="margin:-8px 0 0">${plur(Rl.length, 'relevé')} de frigos ce mois-ci.</p>
  <section class="box"><h3>Registre du mois en PDF</h3>
    <p class="muted small" style="margin:0">Livraisons, températures, décisions et photos d'étiquettes, prêt à présenter en cas de contrôle. Rangé dans Google Drive, dossier « HACCP - Registres PDF ». Il est aussi créé tout seul le 1er de chaque mois.</p>
    ${p && p.etat === 'ok' ? `<a class="btn btn-primary" href="${esc(p.url)}" target="_blank" rel="noopener">${icon('doc')} Ouvrir le PDF de ${nomMois.toLowerCase()}</a>`
      : `<button class="btn btn-primary" id="m-pdf" ${p && p.etat === 'cours' ? 'disabled' : ''}>${p && p.etat === 'cours' ? '<span class="spinner"></span> Création du PDF (jusqu\'à 1 minute)…' : icon('doc') + ' Créer le registre PDF'}</button>`}
    ${p && p.etat === 'err' ? `<p class="missing" style="text-align:left">${esc(p.err)}</p>` : ''}
  </section>
  <section class="stack"><h3>Par type de produit</h3>${barres(compte(L,'type'))}</section>
  <section class="stack"><h3>Par personne</h3>${barres(compte(L,'agent'))}</section>
  <section class="stack"><h3>Non-conformités par fournisseur</h3>${barres(compte(nc,'fournisseur'),'bad')}</section>
  <div class="stack">
    ${!EN_CADRE ? `<button class="btn" id="m-csv">Exporter ce mois (fichier CSV)</button>` : ''}

function lierBilan(){
  const dec = n => { const [a,m] = moisBilan.split('-').map(Number); moisBilan = cleMois(new Date(a, m-1+n, 1)); render(); };
  $('#m-prev').onclick = () => dec(-1); $('#m-next').onclick = () => dec(1);
  const bp = $('#m-pdf'); if (bp) bp.onclick = async () => {
    const mois = moisBilan, [a, m] = mois.split('-').map(Number);
    pdf = {mois, etat:'cours'}; render();
    try{ const j = await api('registre', {annee:a, mois:m}); pdf = {mois, etat:'ok', url:j.registre.url}; toast('Registre PDF créé'); }
    catch(x){ pdf = {mois, etat:'err', err: x.reseau ? 'Pas de connexion internet.' : x.message}; }
    if (vue === 'bilan') render();
  };
  const csv = $('#m-csv'); if (csv) csv.onclick = () => {
    const L = D.receptions.filter(r => cleMois(r.date) === moisBilan).slice().reverse();
    const cols = [['Date',r=>new Date(r.date).toLocaleString('fr-FR')],['Réceptionné par','agent'],['Fournisseur','fournisseur'],['Type','type'],['Température (°C)',r=>r.temperature===null?'':String(r.temperature).replace('.',',')],['Contrôle température','controleTemp'],['Conformité','conformite'],['Motif','motif'],['Remarque','remarque'],['Traitement','traitement'],['Traité par','traitePar']];
    const cell = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
    const txt = '﻿' + [cols.map(c=>cell(c[0])).join(';')].concat(L.map(r => cols.map(([,k]) => cell(typeof k === 'function' ? k(r) : r[k])).join(';'))).join('\r\n');
    const lien = document.createElement('a'); lien.href = URL.createObjectURL(new Blob([txt], {type:'text/csv'})); lien.download = `receptions-${moisBilan}.csv`; lien.click();
  };
}

      try{
        const j = await api('setConfig', {code:resp.code, config:lireConfig()}); resp.config = j.config;
        if (!j.config.emails){ toast("Saisissez d'abord une adresse e-mail.", true); return; }
        await api('testMail', {code:resp.code}); toast('E-mail de test envoyé à ' + j.config.emails);
      }catch(x){ toast(x.message, true); }
    };
    $('#rp-enc-plus').onclick = () => { resp.enc = lireEnceintes(); resp.enc.push({nom:'', ideal:4, limite:4, actif:true}); render(); const n = $(`[data-enc-nom="${resp.enc.length-1}"]`); if (n) n.focus(); };
    $$('[data-enc-suppr]').forEach(b => b.onclick = () => { resp.enc = lireEnceintes(); resp.enc.splice(+b.dataset.encSuppr, 1); render(); });
    $('#rp-enc-save').onclick = async () => {
      const liste = lireEnceintes().filter(e => e.nom);
      try{ const j = await api('enceintes', {code:resp.code, liste}); resp.enc = j.enceintes.map(e => Object.assign({}, e)); D.enceintes = j.enceintes.filter(e => e.actif !== false); sauverCache(); render(); toast('Frigos enregistrés'); }
      catch(x){ toast(x.message, true); }
    };
    $$('[data-edit]').forEach(b => b.onclick = () => { edition = {liste:b.dataset.edit, valeurs:(D[b.dataset.edit]||[]).slice()}; render(); });
    $$('[data-suppr]').forEach(b => b.onclick = () => { edition.valeurs.splice(+b.dataset.suppr, 1); render(); });
    const plus = $('#e-plus'); if (plus) plus.onclick = () => { const v = $('#e-ajout').value.trim(); if (v && !edition.valeurs.includes(v)) edition.valeurs.push(v); render(); $('#e-ajout').focus(); };
    const aj = $('#e-ajout'); if (aj) aj.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); plus.click(); } };
    const an = $('#e-annul'); if (an) an.onclick = () => { edition = null; render(); };
    const sv = $('#e-save'); if (sv) sv.onclick = async () => {
      sv.disabled = true;
      try{ const j = await api('listes', {liste:edition.liste, valeurs:edition.valeurs, code:resp.code}); D[edition.liste] = j.valeurs || edition.valeurs; edition = null; sauverCache(); render(); toast('Liste enregistrée'); }
      catch(x){ sv.disabled = false; toast(x.message, true); }
    };
  }
  const cp = $('#r-copie'); if (cp) cp.onclick = () => { const i = $('#r-lien'); navigator.clipboard.writeText(i.value).then(() => toast('Lien copié'), () => { i.select(); toast('Sélectionnez puis copiez le lien'); }); };
  $('#r-maj').onclick = async () => { try{ await envoyerAttente(); await charger(); render(); toast('Données à jour'); }catch(x){ toast(x.message, true); } };
  const dc = $('#r-deco'); if (dc) dc.onclick = () => { edition = 'deco'; render(); };
  const non = $('#r-non'); if (non) non.onclick = () => { edition = null; render(); };
  const oui = $('#r-oui'); if (oui) oui.onclick = async () => {
    for (const a of attente) await Attente.del(a.id);
    attente = []; LS.del('haccp.cfg'); LS.del('haccp.cache'); cfg = null; D = null; edition = null; resp = null; vue = 'accueil'; render();
  };
}

/* ============================================================ démarrage */
appliquerTheme();
async function demarrer(){
  if (!cfg){ render(); return; }
  try{ attente = await Attente.all(); }catch(e){ attente = []; }
  if (!cfg.demo){ D = LS.get('haccp.cache', null); if (D) fusionner(); } // affichage immédiat, puis mise à jour
  render();
  try{ await charger(); }
  catch(x){
    if (!D){ D = {agents:[], fournisseurs:[], types:[], enceintes:[], receptions:[], releves:[]}; fusionner(); }
    toast(x.reseau ? 'Pas de connexion : affichage des dernières données connues.' : x.message, true);
  }
  if (vueTranquille()) render();
  envoyerAttente();
}
// Envoi automatique et rafraîchissement : retour du réseau, retour sur l'appli, toutes les minutes
window.addEventListener('online', () => { if (cfg && D) envoyerAttente().then(() => charger()).then(() => vueTranquille() && render()).catch(() => {}); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !cfg || !D) return;
  envoyerAttente().then(() => vueTranquille() ? charger().then(() => vueTranquille() && render()) : null).catch(() => {});
});
setInterval(() => { if (attente.length) envoyerAttente(); }, 60000);
if (!cfg && EN_CADRE){ cfg = {demo:true}; }
demarrer();
})();
</script>

<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');</script>
